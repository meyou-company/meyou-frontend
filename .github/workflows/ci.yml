# meyou-frontend — CI (no production secrets / APIs).
# Runs on pull requests and pushes to main.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: meyou-frontend-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-lint-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Isolated Vite build-time URLs (not production hosts or secrets).
      VITE_API_URL: http://127.0.0.1:3001/api
      VITE_SOCKET_URL: http://127.0.0.1:3001
      VITE_PUBLIC_APP_URL: http://127.0.0.1:5173
      VITE_SEC009_CHAT_PRIVATE_DELIVERY_ENABLED: 'false'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Tests (Vitest)
        run: npm run test:ci